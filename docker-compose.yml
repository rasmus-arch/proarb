services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: proarb
      MYSQL_USER: proarb
      MYSQL_PASSWORD: proarb
      MYSQL_ROOT_PASSWORD: proarb-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
