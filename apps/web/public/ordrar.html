<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Ordrar</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50" data-active="ordrar">
    <div id="nav"></div>

    <main class="mx-auto max-w-6xl px-4 py-8">
      <h1 class="text-xl font-semibold text-slate-900">Ordrar</h1>
      <p class="mt-1 text-sm text-slate-600">
        Ordrar skapas idag genom att acceptera och konvertera en offert. Fullt orderflöde
        (direktskapande, statusändringar, utlämning) byggs i Fas 3, se PLAN.md.
      </p>

      <div class="mt-4">
        <input id="search" type="search" placeholder="Sök ordernr eller kund…" class="input max-w-sm" />
      </div>

      <div class="mt-4 overflow-x-auto card">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
          <thead>
            <tr class="text-left text-slate-500">
              <th class="py-2 pr-4 font-medium">Ordernr</th>
              <th class="py-2 pr-4 font-medium">Kund</th>
              <th class="py-2 pr-4 font-medium">Status</th>
              <th class="py-2 pr-4 font-medium">Skapad</th>
              <th class="py-2 pr-4 font-medium text-right">Totalt (ex moms)</th>
            </tr>
          </thead>
          <tbody id="order-rows" class="divide-y divide-slate-100"></tbody>
        </table>
        <p id="empty-state" class="hidden py-6 text-center text-sm text-slate-500">
          Inga ordrar ännu — konvertera en accepterad offert för att skapa en.
        </p>
      </div>
    </main>

    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/ordrar.js"></script>
  </body>
</html>
