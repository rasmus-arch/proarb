<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Nytt lösenord</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-50">
    <div class="w-full max-w-sm px-4">
      <div class="mb-6 flex items-center gap-2.5">
        <span class="h-6 w-1.5 rounded-full bg-accent-400"></span>
        <span class="text-lg font-semibold tracking-tight text-slate-900">ProArb</span>
      </div>
      <form id="reset-form" class="card p-6">
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">Välj nytt lösenord</h1>
        <label class="mt-5 block text-sm">
          <span class="font-medium text-slate-700">Nytt lösenord</span>
          <input id="new-password" type="password" required minlength="8" autocomplete="new-password" class="input mt-1.5" />
        </label>
        <label class="mt-4 block text-sm">
          <span class="font-medium text-slate-700">Upprepa lösenord</span>
          <input id="repeat-password" type="password" required minlength="8" autocomplete="new-password" class="input mt-1.5" />
        </label>
        <p class="mt-2 text-xs text-slate-500">Minst 8 tecken.</p>
        <p id="reset-error" class="mt-3 hidden text-sm text-red-600"></p>
        <button type="submit" class="btn mt-6 w-full">Spara lösenord</button>
      </form>
    </div>
    <script type="module" src="/js/pages/reset-password.js"></script>
  </body>
</html>
