<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Offerter</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50" data-active="offerter">
    <div id="nav"></div>

    <main class="mx-auto max-w-6xl px-4 py-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-xl font-semibold text-slate-900">Offerter</h1>
        <a href="/offert-editor.html" class="btn">Ny offert</a>
      </div>

      <div class="mt-4 flex flex-wrap gap-2">
        <input id="search" type="search" placeholder="Sök offertnr eller kund…" class="input max-w-sm" />
        <select id="status-filter" class="input max-w-[200px]">
          <option value="">Alla statusar</option>
          <option value="DRAFT">Utkast</option>
          <option value="SENT">Skickad</option>
          <option value="VIEWED">Visad</option>
          <option value="ACCEPTED">Accepterad</option>
          <option value="DECLINED">Avböjd</option>
          <option value="CONVERTED">Omvandlad till order</option>
        </select>
      </div>

      <div class="mt-4 overflow-x-auto card">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
          <thead>
            <tr class="text-left text-slate-500">
              <th class="py-2 pr-4 font-medium">Offertnr</th>
              <th class="py-2 pr-4 font-medium">Kund</th>
              <th class="py-2 pr-4 font-medium">Status</th>
              <th class="py-2 pr-4 font-medium">Skapad</th>
              <th class="py-2 pr-4 font-medium text-right">Totalt (ex moms)</th>
            </tr>
          </thead>
          <tbody id="quote-rows" class="divide-y divide-slate-100"></tbody>
        </table>
        <p id="empty-state" class="hidden py-6 text-center text-sm text-slate-500">
          Inga offerter ännu — skapa den första med knappen ovan.
        </p>
      </div>
    </main>

    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/offerter.js"></script>
  </body>
</html>
