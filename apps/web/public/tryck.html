<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Tryck</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50" data-active="tryck">
    <div id="nav"></div>

    <main class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="text-xl font-semibold text-slate-900">Tryckkö</h1>
      <p class="mt-1 text-sm text-slate-600">Alla orderrader som har en tryckmetod, oavsett order, sorterade äldst först.</p>

      <div class="mt-4 flex flex-wrap gap-1 border-b border-slate-200">
        <button type="button" class="tab-btn" data-status="">Alla</button>
        <button type="button" class="tab-btn" data-status="WAITING">Väntar</button>
        <button type="button" class="tab-btn" data-status="IN_PRODUCTION">I produktion</button>
        <button type="button" class="tab-btn" data-status="READY">Klara</button>
      </div>

      <div class="mt-3 overflow-x-auto card">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
          <thead>
            <tr class="text-left text-slate-500">
              <th class="py-2 pr-3 font-medium">Order</th>
              <th class="py-2 pr-3 font-medium">Kund</th>
              <th class="py-2 pr-3 font-medium">Produkt</th>
              <th class="py-2 pr-3 font-medium">Tryckmetod</th>
              <th class="py-2 pr-3 font-medium text-right">Antal</th>
              <th class="py-2 pr-3 font-medium">Status</th>
              <th class="py-2 pr-3 font-medium"></th>
            </tr>
          </thead>
          <tbody id="queue-rows" class="divide-y divide-slate-100"></tbody>
        </table>
        <p id="queue-empty" class="hidden py-6 text-center text-sm text-slate-500">Inga tryckorder just nu.</p>
      </div>
    </main>

    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/pages/tryck.js"></script>
  </body>
</html>
