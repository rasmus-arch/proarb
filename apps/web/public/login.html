<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Logga in</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-50">
    <div class="w-full max-w-sm px-4">
      <div class="mb-6 flex items-center gap-2.5">
        <span class="h-6 w-1.5 rounded-full bg-accent-400"></span>
        <span class="text-lg font-semibold tracking-tight text-slate-900">ProArb</span>
      </div>
      <form id="login-form" class="card p-6">
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">Logga in</h1>

        <label class="mt-5 block text-sm">
          <span class="font-medium text-slate-700">E-post</span>
          <input id="email" type="email" required autocomplete="username" class="input mt-1.5" />
        </label>
        <label class="mt-4 block text-sm">
          <span class="font-medium text-slate-700">Lösenord</span>
          <input id="password" type="password" required autocomplete="current-password" class="input mt-1.5" />
        </label>

        <p id="login-error" class="mt-3 hidden text-sm text-red-600"></p>

        <button type="submit" class="btn mt-6 w-full">Logga in</button>
        <button type="button" id="forgot-link" class="mt-4 block w-full text-center text-sm text-slate-500 transition-colors hover:text-slate-900">Glömt lösenord?</button>
      </form>

      <form id="forgot-form" class="card hidden p-6">
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">Glömt lösenord</h1>
        <p class="mt-1 text-sm text-slate-600">Ange din e-post så skickar vi en länk för att välja ett nytt lösenord.</p>
        <label class="mt-5 block text-sm">
          <span class="font-medium text-slate-700">E-post</span>
          <input id="forgot-email" type="email" required autocomplete="username" class="input mt-1.5" />
        </label>
        <p id="forgot-message" class="mt-3 hidden text-sm text-slate-700"></p>
        <button type="submit" class="btn mt-6 w-full">Skicka länk</button>
        <button type="button" id="back-to-login" class="mt-4 block w-full text-center text-sm text-slate-500 transition-colors hover:text-slate-900">Tillbaka till inloggning</button>
      </form>
    </div>

    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
