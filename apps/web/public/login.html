<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Logga in</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-50">
    <div class="w-full max-w-sm px-4">
      <div class="mb-6 flex items-center gap-2.5">
        <span class="h-6 w-1.5 rounded-full bg-accent-400"></span>
        <span class="text-lg font-semibold tracking-tight text-slate-900">ProArb</span>
      </div>
      <form id="login-form" class="card p-6">
        <h1 class="text-xl font-semibold tracking-tight text-slate-900">Logga in</h1>

        <label class="mt-5 block text-sm">
          <span class="font-medium text-slate-700">E-post</span>
          <input id="email" type="email" required autocomplete="username" class="input mt-1.5" />
        </label>
        <label class="mt-4 block text-sm">
          <span class="font-medium text-slate-700">Lösenord</span>
          <input id="password" type="password" required autocomplete="current-password" class="input mt-1.5" />
        </label>

        <p id="login-error" class="mt-3 hidden text-sm text-red-600"></p>

        <button type="submit" class="btn mt-6 w-full">Logga in</button>
      </form>
    </div>

    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
