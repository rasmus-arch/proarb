<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProArb – Offert</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50" data-active="offerter">
    <div id="nav"></div>

    <main class="mx-auto max-w-4xl px-4 py-8">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 id="page-title" class="text-xl font-semibold text-slate-900">Ny offert</h1>
          <span id="status-badge" class="mt-1 hidden rounded-full px-2 py-0.5 text-xs font-medium"></span>
        </div>
        <div class="flex flex-col items-end gap-1">
          <div id="action-buttons" class="flex flex-wrap items-center gap-2"></div>
          <p id="email-notification" class="hidden text-xs text-slate-500"></p>
        </div>
      </div>

      <!-- Customer -->
      <section class="mt-6 card">
        <h2 class="text-sm font-medium text-slate-900">Kund</h2>
        <div id="customer-picker" class="mt-2">
          <div class="flex items-center gap-2">
            <input id="customer-search" type="text" placeholder="Sök kund…" class="input max-w-sm" />
            <button type="button" id="new-customer-quick-btn" class="text-sm text-blue-700 underline whitespace-nowrap">+ Ny kund</button>
          </div>
          <div id="customer-results" class="mt-1 max-w-sm divide-y divide-slate-100 rounded-md border border-slate-200 bg-white text-sm empty:hidden"></div>
        </div>
        <div id="customer-selected" class="mt-2 hidden items-center gap-3">
          <span class="font-medium text-slate-900" id="customer-selected-name"></span>
          <button type="button" id="customer-change-btn" class="text-sm text-blue-700 underline">Byt</button>
        </div>

        <div class="mt-3 max-w-sm">
          <label class="block text-sm">
            <span class="flex items-center justify-between text-slate-700">
              Referensperson
              <button type="button" id="new-contact-quick-btn" disabled class="text-xs text-blue-700 underline disabled:pointer-events-none disabled:text-slate-300">+ Ny kontakt</button>
            </span>
            <select id="reference-select" class="input mt-1">
              <option value="">Ingen referens</option>
            </select>
          </label>
        </div>
      </section>

      <!-- Lines -->
      <section class="mt-4 card">
        <h2 class="text-sm font-medium text-slate-900">Rader</h2>

        <div id="line-search-wrap" class="mt-2 flex flex-wrap items-start gap-2">
          <div class="relative max-w-md flex-1">
            <input id="line-search" type="text" placeholder="Sök produkt att lägga till…" class="input" />
            <div id="line-results" class="absolute z-10 mt-1 w-full divide-y divide-slate-100 rounded-md border border-slate-200 bg-white text-sm shadow-md empty:hidden"></div>
          </div>
          <button type="button" id="add-fritext-btn" class="btn-secondary whitespace-nowrap">+ Fritextrad</button>
          <button type="button" id="add-product-btn" class="btn-secondary whitespace-nowrap">+ Ny produkt</button>
        </div>

        <div class="mt-3 overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead>
              <tr class="text-left text-slate-500">
                <th class="py-2 pr-3 font-medium">Produkt</th>
                <th class="py-2 pr-3 font-medium w-20">Antal</th>
                <th class="py-2 pr-3 font-medium w-28">à-pris ex moms</th>
                <th class="py-2 pr-3 font-medium w-20">Rabatt %</th>
                <th class="py-2 pr-3 font-medium">Tryck</th>
                <th class="py-2 pr-3 font-medium text-right">Summa ex moms</th>
                <th class="py-2 pr-3 font-medium text-right">Marginal</th>
                <th class="py-2 pr-3 font-medium"></th>
              </tr>
            </thead>
            <tbody id="line-rows" class="divide-y divide-slate-100"></tbody>
          </table>
          <p id="lines-empty" class="py-4 text-center text-sm text-slate-500">Inga rader tillagda ännu.</p>
        </div>

        <div class="mt-3 flex justify-end">
          <dl class="w-64 space-y-1 text-sm">
            <div class="flex justify-between"><dt class="text-slate-600">Delsumma ex moms</dt><dd id="totals-subtotal">0,00 kr</dd></div>
            <div class="flex justify-between"><dt class="text-slate-600">Moms</dt><dd id="totals-vat">0,00 kr</dd></div>
            <div class="flex justify-between font-semibold"><dt>Totalt</dt><dd id="totals-total">0,00 kr</dd></div>
            <div class="flex justify-between border-t border-slate-200 pt-1 text-slate-600"><dt>Marginal</dt><dd id="totals-margin">0,00 kr</dd></div>
          </dl>
        </div>
      </section>

      <!-- Notes / validity -->
      <section class="mt-4 card">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <label class="block text-sm">
            <span class="text-slate-700">Giltig till</span>
            <input id="valid-until" type="date" class="input mt-1" />
          </label>
        </div>
        <label class="mt-3 block text-sm">
          <span class="text-slate-700">Anteckningar</span>
          <textarea id="notes" rows="3" class="input mt-1"></textarea>
        </label>
      </section>

      <p id="form-error" class="mt-3 hidden text-sm text-red-600"></p>

      <div class="mt-4 flex justify-end gap-2">
        <button type="button" id="save-btn" class="btn">Spara utkast</button>
      </div>

      <!-- Read-only history, shown once the quote has been sent -->
      <section id="history-section" class="mt-6 hidden card">
        <h2 class="text-sm font-medium text-slate-900">Historik</h2>
        <ul id="history-list" class="mt-2 space-y-1 text-sm text-slate-600"></ul>
      </section>
    </main>

    <!-- Fritextrad dialog -->
    <dialog id="fritext-dialog" class="w-full max-w-md rounded-lg p-0 backdrop:bg-slate-900/40">
      <form id="fritext-form" method="dialog" class="card m-0">
        <h2 class="text-lg font-medium text-slate-900">Fritextrad</h2>
        <div class="mt-3 grid grid-cols-1 gap-3">
          <label class="block text-sm">
            <span class="text-slate-700">Beskrivning *</span>
            <input name="description" required class="input mt-1" />
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="block text-sm">
              <span class="text-slate-700">Antal *</span>
              <input name="quantity" type="number" min="0.01" step="0.01" value="1" required class="input mt-1" />
            </label>
            <label class="block text-sm">
              <span class="text-slate-700">à-pris ex moms *</span>
              <input name="unitPrice" type="number" min="0" step="0.01" required class="input mt-1" />
            </label>
          </div>
          <label class="block text-sm">
            <span class="text-slate-700">Momssats %</span>
            <input name="taxRatePercent" type="number" min="0" max="100" step="1" value="25" class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Tryckbeskrivning (valfritt, hamnar i tryckkön om ifylld)</span>
            <input name="printDescription" class="input mt-1" />
          </label>
        </div>
        <div class="mt-5 flex justify-end gap-2">
          <button type="button" id="cancel-fritext-btn" class="btn-secondary">Avbryt</button>
          <button type="submit" class="btn">Lägg till</button>
        </div>
      </form>
    </dialog>

    <!-- New product dialog -->
    <dialog id="new-product-dialog" class="w-full max-w-md rounded-lg p-0 backdrop:bg-slate-900/40">
      <form id="new-product-form" method="dialog" class="card m-0">
        <h2 class="text-lg font-medium text-slate-900">Ny produkt</h2>
        <div class="mt-3 grid grid-cols-1 gap-3">
          <label class="block text-sm">
            <span class="text-slate-700">Namn *</span>
            <input name="name" required class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Artikelnummer</span>
            <input name="articleNumber" class="input mt-1" placeholder="Genereras automatiskt om tomt" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Leverantör *</span>
            <input name="supplier" list="new-product-supplier-options" required class="input mt-1" />
            <datalist id="new-product-supplier-options"></datalist>
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="block text-sm">
              <span class="text-slate-700">Pris ex moms *</span>
              <input name="basePrice" type="number" min="0" step="0.01" required class="input mt-1" />
            </label>
            <label class="block text-sm">
              <span class="text-slate-700">Kostnadspris</span>
              <input name="costPrice" type="number" min="0" step="0.01" class="input mt-1" />
            </label>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <label class="block text-sm">
              <span class="text-slate-700">Färg</span>
              <input name="color" class="input mt-1" />
            </label>
            <label class="block text-sm">
              <span class="text-slate-700">Storlek</span>
              <input name="size" class="input mt-1" />
            </label>
          </div>
        </div>
        <p id="new-product-error" class="mt-2 hidden text-sm text-red-600"></p>
        <div class="mt-5 flex justify-end gap-2">
          <button type="button" id="cancel-new-product-btn" class="btn-secondary">Avbryt</button>
          <button type="submit" class="btn">Skapa och lägg till</button>
        </div>
      </form>
    </dialog>

    <!-- Quick-add: ny kund / ny kontakt (hämtbehörig), delad dialog med order-editor.html -->
    <dialog id="quick-new-customer-dialog" class="w-full max-w-md rounded-lg p-0 backdrop:bg-slate-900/40">
      <form id="quick-new-customer-form" method="dialog" class="card m-0">
        <h2 class="text-lg font-medium text-slate-900">Ny kund</h2>
        <div class="mt-4 grid grid-cols-1 gap-3">
          <label class="block text-sm">
            <span class="text-slate-700">Namn *</span>
            <input name="name" required class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Org.nr</span>
            <input name="orgNumber" class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Telefon</span>
            <input name="phone" class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">E-post</span>
            <input name="email" type="email" class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Adress</span>
            <input name="address" class="input mt-1" />
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="block text-sm">
              <span class="text-slate-700">Postnr</span>
              <input name="postalCode" class="input mt-1" />
            </label>
            <label class="block text-sm">
              <span class="text-slate-700">Ort</span>
              <input name="city" class="input mt-1" />
            </label>
          </div>
          <label class="block text-sm">
            <span class="text-slate-700">Betalningsvillkor (dagar)</span>
            <input name="paymentTermsDays" type="number" min="0" placeholder="30" class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Anteckningar</span>
            <textarea name="notes" rows="2" class="input mt-1"></textarea>
          </label>
        </div>
        <p id="quick-new-customer-error" class="mt-3 hidden text-sm text-red-600"></p>
        <div class="mt-5 flex justify-end gap-2">
          <button type="button" id="quick-new-customer-cancel" class="btn-secondary">Avbryt</button>
          <button type="submit" class="btn">Skapa</button>
        </div>
      </form>
    </dialog>

    <dialog id="quick-new-contact-dialog" class="w-full max-w-md rounded-lg p-0 backdrop:bg-slate-900/40">
      <form id="quick-new-contact-form" method="dialog" class="card m-0">
        <h2 class="text-lg font-medium text-slate-900">Ny kontakt</h2>
        <div class="mt-4 grid grid-cols-1 gap-3">
          <label class="block text-sm">
            <span class="text-slate-700">Namn *</span>
            <input name="name" required class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Telefon</span>
            <input name="phone" class="input mt-1" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">E-post</span>
            <input name="email" type="email" class="input mt-1" />
          </label>
          <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" name="canPickup" class="rounded border-slate-300" />
            <span class="text-slate-700">Hämtbehörig</span>
          </label>
        </div>
        <p id="quick-new-contact-error" class="mt-3 hidden text-sm text-red-600"></p>
        <div class="mt-5 flex justify-end gap-2">
          <button type="button" id="quick-new-contact-cancel" class="btn-secondary">Avbryt</button>
          <button type="submit" class="btn">Skapa</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/quick-add.js"></script>
    <script type="module" src="/js/pages/offert-editor.js"></script>
  </body>
</html>
